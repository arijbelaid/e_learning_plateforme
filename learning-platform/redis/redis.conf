# ============================================================
# Redis Configuration - Learning Platform
# ============================================================

# Network
bind 0.0.0.0
port 6379
protected-mode yes
requirepass redis_secure_password

# General
daemonize no
loglevel notice
databases 16

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511
